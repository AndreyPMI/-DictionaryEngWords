name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK (KMP и современный Android требуют 17+)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Даем права на gradlew
      - name: Grant execute permission
        run: chmod +x gradlew

      # Проверяем что wrapper валидный
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      # Основная сборка
      - name: Build project
        run: ./gradlew build --stacktrace

      # Android lint
      - name: Run lint
        run: ./gradlew lint

      # Unit tests
      - name: Run unit tests
        run: ./gradlew test

      # Если подключишь Spotless
      - name: Check formatting
        run: ./gradlew spotlessCheck
